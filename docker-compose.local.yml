services:

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/resume_builder.db
    volumes:
      - db_data:/data
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
