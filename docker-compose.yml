services:

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/resume_builder.db
    volumes:
      - db_data:/data
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        # Замени на свой домен
        NEXT_PUBLIC_API_URL: https://api.waytooffer.ru
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run manually: docker compose run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done"

volumes:
  db_data:
  certbot_www:
  certbot_certs:

networks:
  internal:
