# =============================================================================
# nginx.conf — WayToOffer
# Замени waytooffer.ru на свой домен везде ниже
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;
    client_max_body_size 20m;

    # ── HTTP → HTTPS redirect + certbot challenge ─────────────────────────────
    server {
        listen 80;
        server_name waytooffer.ru api.waytooffer.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Frontend (waytooffer.ru) ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name waytooffer.ru;

        ssl_certificate     /etc/letsencrypt/live/waytooffer.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/waytooffer.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Backend API (api.waytooffer.ru) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.waytooffer.ru;

        ssl_certificate     /etc/letsencrypt/live/waytooffer.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/waytooffer.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass       http://backend:8000;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
