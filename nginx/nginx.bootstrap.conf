# =============================================================================
# nginx.bootstrap.conf — HTTP only, used during first-time SSL cert issuance.
# server-init.sh temporarily swaps this in place of nginx.conf,
# runs certbot to get certificates, then restores the real nginx.conf.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name waytooffer.ru api.waytooffer.ru;

        # certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "Initializing SSL...\n";
            add_header Content-Type text/plain;
        }
    }
}
